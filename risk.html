<style>

.rk-big span { color: var(--ink-2); font-size: 14.5px; } .rk-big span.lb { font-weight: 700; color: var(--ink); font-size: 15px; } .rk-big span.sep { color: var(--line); margin: 0 8px; }

.rk-leg div { border-left: 4px solid var(--grid); padding: 2px 0 2px 10px; } .rk-leg div.ok { border-color: var(--c-ok); } .rk-leg div.warn { border-color: var(--c-warn); } .rk-leg div.will { border-color: var(--c-will); } .rk-leg div.past { border-color: var(--c-past); } .rk-leg div.stale { border-color: var(--c-stale); }
.rk-leg small { display: block; color: var(--ink-2); font-size: 13.5px; white-space: nowrap; } .rk-leg b { font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; } .rk-leg em { font-style: normal; color: var(--ink-2); font-size: 13.5px; margin-left: 5px; }

.rk-cz b { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; } .rk-cz span.d { color: var(--ink-2); font-size: 13.5px; white-space: nowrap; } .rk-cz span.n { white-space: nowrap; font-weight: 600; }

:root[data-theme="dark"] .rk-chip.will { color: #f0a877; } :root[data-theme="dark"] .rk-chip.warn { color: #e3c65a; }

tr.rk-d > td { padding: 4px 12px 22px 26px !important; text-align: left !important; white-space: normal !important; background: color-mix(in srgb, var(--brand-2) 4%, transparent); }
.rk-dg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; align-items: start; } .rk-dg > div { min-width: 0; overflow-x: auto; }

table.rk-s { border-collapse: collapse; font-size: 14.5px; width: 100%; } main.rk table.rk-s th, main.rk table.rk-s td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }

table.rk-s td.hm { min-width: 92px; } table.rk-s td.hm b { display: block; } table.rk-s td.hm small { color: var(--ink-2); font-size: 13.5px; }
table.rk-s td.z { color: var(--ink-3); }
.rk-dg table.rk-s { min-width: 100%; }
.rk-w { white-space: normal; word-break: keep-all; text-align: left; min-width: 240px; line-height: 1.5; }
.rk-more { margin-top: 14px; } .rk-more summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
.rk-m { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); gap: 14px; align-items: end; overflow-x: auto; padding-top: 6px; }
.rk-m .col { text-align: center; } .rk-m .bx { height: 150px; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 6px 6px 0 0; overflow: hidden; }
.rk-m .bx i { display: block; } .rk-m .bx i.r { background: var(--c-past); } .rk-m .bx i.o { background: var(--c-ok); opacity: .55; } .rk-m .bx i.s { background: var(--c-stale); }
.rk-m b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 6px; } .rk-m small { color: var(--ink-2); font-size: 13.5px; display: block; white-space: nowrap; } .rk-m em { font-style: normal; color: var(--bad); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.rk-rule { color: var(--ink-2); font-size: 13.5px; margin: 10px 0 0; }

/* 납기월별 미결 = 가로 막대 표(11/10 사용자 '이대로 보고하면 되냐') — 막대 길이 = 미결 톤, 빨강 = 위험 */
.rk table.rk-mt { width: 100%; border-collapse: collapse; font-size: 14.5px; } .rk table.rk-mt th { font-size: 13.5px; font-weight: 600; color: var(--ink-2); padding: 8px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.rk table.rk-mt td { padding: 13px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: middle; } .rk table.rk-mt td:nth-child(3) { width: 46%; min-width: 260px; }

.rk-mb { display: flex; height: 24px; border-radius: 6px; overflow: hidden; min-width: 8px; } .rk-mb i { display: block; height: 100%; font-style: normal; color: #fff; font-size: 13.5px; font-weight: 700; line-height: 24px; text-align: center; overflow: hidden; }
