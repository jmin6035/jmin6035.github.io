<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편성</title>
<meta name="description" content="이번 생산주 라인별 편성(지난 날 = 실적) — 칸을 누르면 그날 작업 순서 · 아래 = 작업 순서 수정">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><clipPath id='c'><rect width='40' height='40' rx='11'/></clipPath></defs><g clip-path='url(%23c)'><rect width='40' height='40' fill='%231b3f5f'/><path d='M-6 30 30-6h9L3 30z' fill='%233774a1'/><path d='M4 40 40 4v9L13 40z' fill='%236cb1d8'/><path d='M17 40 40 17v8L25 40z' fill='%23fff'/></g></svg>">
<link rel="stylesheet" href="ui/theme.css?v=2611120206">
<style>
main.wrap { max-width: none; }
html.v2 #ui-ctl { display: none !important; }   /* 11/12: 공통 관제 알약 줄은 편성과 상관없어 숨김 */
/* 11/12 사용자 '편성 더 이쁘게 간략하게': 위 = 이번 생산주(수~화) 라인별 캘린더(생산 일정 화면과 같은 칸 — cg_calendar·cc_calendar 그대로) · 칸 누르면 그날 작업 순서 · 아래 = 작업 순서 수정
   글자 3단계: 큰 톤 20px · 본문 16px · 보조 14px — 모두 가운데 */
#ps-main { font-size: 16px; text-align: center; }
:root { --c-conf: #2e7d32; --c-plan: #3774a1; --c-fcst: #8fb8dc; --c-gap: #f4f6f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-conf: #4caf50; --c-plan: #5b9bd0; --c-fcst: #2f4f6c; --c-gap: #2a3038; } }
:root[data-theme="dark"] { --c-conf: #4caf50; --c-plan: #5b9bd0; --c-fcst: #2f4f6c; --c-gap: #2a3038; }
#ps-main .card > h2 { font-size: 16px !important; font-weight: 800; text-align: center; justify-content: center; }
html.v2 main #ps-main .xbtn { font-size: 14px !important; }
.ps-line { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 22px; margin: 4px 0 16px; font-size: 16px; color: var(--ink-2); }
.ps-line b { color: var(--ink); font-weight: 800; } .ps-line .ar { color: var(--ink-3); }
.ps-lg { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 16px; font-size: 14px; color: var(--ink-2); margin: 0 0 10px; }
.ps-lg span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ps-lg i { display: inline-block; width: 18px; height: 8px; border-radius: 999px; } .ps-lg i.ln { width: 4px; height: 16px; border-radius: 2px; }
.ps-lg .sep { width: 1px; height: 16px; background: var(--line); }
/* 캘린더 — 표 양식은 생산 일정 화면과 같고 칸 안은 편성 화면용(pyeonseong.js grid). 글자 20/16/14 · 모두 가운데 · 빨강 = 확인 필요 줄에만 */
:root { --g1: #2a78d6; --g2: #1baf7a; --g3: #6250d6; --g4: #eda100; --g0: #b4bcc6; --c-ov: #c2410c; --c-act: #5b6573; --c-today: color-mix(in srgb, var(--brand-2) 7%, var(--surface)); --c-past: color-mix(in srgb, var(--ink) 4%, var(--surface)); --c-mc: #ffe066; --c-rule: color-mix(in srgb, var(--ink) 30%, var(--surface)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --g1: #3987e5; --g2: #199e70; --g3: #9085e9; --g4: #c98500; --g0: #5a6470; --c-ov: #ff8c42; --c-act: #8a96a3; --c-mc: #8a6d00; } }
:root[data-theme="dark"] { --g1: #3987e5; --g2: #199e70; --g3: #9085e9; --g4: #c98500; --g0: #5a6470; --c-ov: #ff8c42; --c-act: #8a96a3; --c-mc: #8a6d00; }
.wk { overflow-x: auto; }
table.psw { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1000px; table-layout: fixed; font-variant-numeric: tabular-nums; }
html body main #ps-main table.psw :is(th, td) { font-size: 16px !important; padding: 0 !important; border: 0; border-right: 1px solid var(--grid); text-align: center !important; line-height: 1.4 !important; white-space: nowrap; }
html body main #ps-main table.psw tbody td { vertical-align: top !important; height: 1px; }
html body main #ps-main table.psw tr > :first-child { width: 112px; border-left: 1px solid var(--grid); }
html body main #ps-main table.psw tbody tr > * { border-top: 1px solid var(--grid); }
html body main #ps-main table.psw tbody tr.ln + tr > *, html body main #ps-main table.psw tbody tr:first-child > * { border-top: 2px solid var(--c-rule); }
html body main #ps-main table.psw tbody tr:last-child > * { border-bottom: 1px solid var(--grid); }
/* 머리: 오늘 = 진한 파랑·흰 글자, 나머지 = 옅게 */
html body main #ps-main table.psw thead th { background: var(--sub) !important; color: var(--ink) !important; font-weight: 800 !important; padding: 9px 4px !important; vertical-align: middle !important; }
html body main #ps-main table.psw thead th.td { background: var(--brand) !important; color: #fff !important; }
html body main #ps-main table.psw thead th.cn { background: var(--tint-2) !important; }
html body main #ps-main table.psw thead th small { display: inline-block; margin-left: 6px; font-size: 14px !important; font-weight: 600 !important; color: var(--ink-2) !important; }
html body main #ps-main table.psw thead th.cn small { display: block; margin: 0; }
html body main #ps-main table.psw thead th.td small { color: #fff !important; opacity: .9; }
/* 행 머리 */
html body main #ps-main table.psw tbody th { background: var(--tint-2) !important; font-weight: 800 !important; padding: 10px 4px !important; vertical-align: middle !important; }
html body main #ps-main table.psw tbody th small { display: block; font-size: 14px !important; font-weight: 600 !important; color: var(--ink-2); }
html body main #ps-main table.psw tbody th small.ovt { color: var(--c-ov); font-weight: 800 !important; }
/* 열 바탕: 오늘 = 옅은 파랑(칸 테두리 없이 열 통째) · 지난 날 = 옅은 회색 */
table.psw td.td { background: var(--c-today); }
table.psw td.pst { background: var(--c-past); }
html body main #ps-main table.psw .pad { background: transparent !important; border: 0 !important; }
/* 칸 */
button.cell { position: relative; display: flex; flex-direction: column; align-items: stretch; width: 100%; height: 100%; min-height: 150px; border: 0; padding: 0; margin: 0; background: transparent; color: var(--ink); font: inherit; text-align: center; cursor: pointer; }
tr.idle button.cell { min-height: 0; }
button.cell:hover { background: color-mix(in srgb, var(--brand-2) 6%, transparent); }
button.cell.pcell { cursor: default; } button.cell.pcell:hover { background: transparent; }
button.cell.on { box-shadow: inset 0 0 0 3px var(--brand-2); }
button.cell.fl { box-shadow: inset 4px 0 0 var(--bad); }
button.cell.fl.on { box-shadow: inset 4px 0 0 var(--bad), inset 0 0 0 3px var(--brand-2); }
button.cell.stp { cursor: default; } button.cell.stp:hover { background: transparent; }
.band { flex: 0 0 24px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; line-height: 24px; background: var(--tint-2); color: var(--ink-2); }
.band.mc { background: var(--c-mc); color: #2b1a00; }
:root[data-theme="dark"] .band.mc { color: #fff6d6; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .band.mc { color: #fff6d6; } }
button.cell.stp .band { flex: 1 1 auto; min-height: 40px; background: transparent; color: var(--ink-3); }
.bd { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; }
.r1 { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 28px; }
.tv { font-size: 20px; font-weight: 800; line-height: 1.2; color: var(--ink); }
.tv small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 1px; }
.pc { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.pc.ov { color: var(--c-ov); font-weight: 800; } .pc.lo { color: var(--ink-3); }
.fam, .ac { display: inline-block; border-radius: 6px; padding: 0 7px; font-size: 14px; font-weight: 800; line-height: 1.6; white-space: nowrap; background: var(--tint-2); color: var(--ink-2); }
.ac { background: var(--c-act); color: #fff; }
.fam-AL { background: #e6f0fb; color: #1d5a96; } .fam-AZ { background: #eef6e8; color: #3d6b1f; } .fam-MAC { background: #f3ecfb; color: #5b2f8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fam-AL { background: #1d3550; color: #9cc6f0; } :root:not([data-theme="light"]) .fam-AZ { background: #23381a; color: #b5dc95; } :root:not([data-theme="light"]) .fam-MAC { background: #34244a; color: #d2b6f2; } }
:root[data-theme="dark"] .fam-AL { background: #1d3550; color: #9cc6f0; } :root[data-theme="dark"] .fam-AZ { background: #23381a; color: #b5dc95; } :root[data-theme="dark"] .fam-MAC { background: #34244a; color: #d2b6f2; }
/* 상태 막대 8px · 그룹 누적 막대 6px — 둥근 끝 */
.sb, .gb, .mb { display: flex; align-self: stretch; overflow: hidden; border-radius: 999px; background: var(--c-gap); }
.sb { height: 8px; } .gb { height: 6px; margin-top: 4px; } .mb { height: 6px; }
.sb i, .gb i, .mb i { display: block; height: 100%; }
.sb .c { background: var(--c-conf); } .sb .p { background: var(--c-plan); } .sb .f { background: repeating-linear-gradient(135deg, var(--c-plan) 0 2px, var(--c-fcst) 2px 5px); } .sb .a { background: var(--c-act); }
.sb .kw, i.kw { background: #44546a; } .sb .ky, i.ky { background: #e0a800; } .sb .kb, i.kb { background: #2a78d6; } .sb .kg, i.kg { background: #2e7d32; }
.sb .kc, i.kc { background: repeating-linear-gradient(135deg, #44546a 0 2px, #c3cad4 2px 5px); }
.gb i + i { box-shadow: inset 1px 0 0 var(--surface); }
.sn { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 12px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.sn span { white-space: nowrap; }
.sn.gn { gap: 0 10px; } .sn.gn span::before, .sn.gn span + span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 4px 1px 0; background: var(--gc); vertical-align: middle; }
.sn.pls { gap: 0 6px; } .sn.pls span + span::before { content: '+'; margin-right: 6px; color: var(--ink-3); }
.sn.mv { color: var(--brand-2); font-weight: 700; }
.fx { font-size: 14px; font-weight: 800; line-height: 1.4; color: var(--ink); white-space: normal; word-break: keep-all; }
.wn { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: auto; padding-top: 2px; }
.wc { display: inline-block; border-radius: 6px; padding: 0 7px; font-size: 14px; font-weight: 700; line-height: 1.6; white-space: nowrap; background: var(--warn-bg); color: var(--warn); }
.bd:has(.wn) { flex: 1 1 auto; }
/* 하루 합 · 자가재 */
html body main #ps-main table.psw tr.dsum td, html body main #ps-main table.psw tr.jg td { padding: 12px !important; vertical-align: middle !important; }
table.psw tr.dsum .sn { margin-top: 2px; }
.jl { display: flex; justify-content: center; gap: 8px; font-size: 14px; line-height: 1.4; color: var(--ink-2); } .jl b { color: var(--ink); font-weight: 800; }
.mb { margin: 3px 0 6px; } .mb .jp { background: var(--ink-3); } .mb .js { background: var(--g4); }
.jd { font-size: 16px; font-weight: 800; } .jd.ng { color: var(--c-ov); } .jd.ok { color: var(--good); }
.mk { display: inline-block; font-size: 14px; background: var(--tint-2); color: var(--ink-2); border-radius: 6px; padding: 0 7px; margin-top: 4px; }
/* 칸 누르면 = 그날 작업 순서 */
.ps-day { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ps-dh { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; padding: 10px 14px; background: var(--tint-2); font-size: 16px; }
.ps-dh b { font-weight: 800; } .ps-dh span { color: var(--ink-2); }
.ps-dh button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 6px; padding: 2px 12px; cursor: pointer; }
table.ps-seq { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
html.v2 body main table.ps-seq:not(.v2-grid) :is(td, th) { padding: 8px 10px !important; font-size: 16px !important; line-height: 1.5 !important; text-align: center !important; }
html.v2 body main table.ps-seq:not(.v2-grid) thead th { font-size: 14px !important; }
table.ps-seq :is(th, td) { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 16px; text-align: center; vertical-align: middle; }
table.ps-seq td.no { white-space: nowrap; font-weight: 600; }
table.ps-seq td.cn, table.ps-seq td.sz, table.ps-seq td.t, table.ps-seq td.dl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.ps-seq tr.fx td { font-weight: 800; }
table.ps-seq tr.lt td.dl { color: var(--warn); font-weight: 800; }
i.kd { display: inline-block; font-style: normal; border-radius: 10px; padding: 0 10px; font-size: 14px; font-weight: 800; white-space: nowrap; color: #fff; line-height: 1.6; }
i.kd.k1 { background: var(--c-conf); } i.kd.k2 { background: var(--c-plan); } i.kd.k3 { background: var(--c-fcst); color: var(--ink); }
i.kd.w1 { background: #44546a; } i.kd.w2 { background: #e0a800; color: #2b1a00; } i.kd.w3 { background: #2a78d6; } i.kd.w4 { background: #2e7d32; }
.cp { display: inline-block; border-radius: 5px; padding: 0 7px; font-size: 14px; font-weight: 700; white-space: nowrap; background: var(--tint-2); margin: 1px 2px; }
.cp.al { background: #e6f0fb; color: #1d5a96; } .cp.cl { background: var(--sub); }
.ps-empty { padding: 16px; color: var(--ink-2); font-size: 16px; }
#ps-frame { display: block; width: 100%; border: 0; height: 900px; background: transparent; }
@media (max-width: 760px) {
  table.ps-seq colgroup, table.ps-seq thead { display: none; }
  table.ps-seq, table.ps-seq tbody { display: block; }
  table.ps-seq tr { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  table.ps-seq td { display: block; border: 0; padding: 0 !important; }
}
</style>
</head>
<body>
<header id="shell" data-page="pyeonseong" data-crumb="편성" data-title="편성"></header>
<main class="wrap">
  <section class="card lock" id="ps-lock">
    <div><div class="ic" aria-hidden="true">🔒</div><h2>불러오는 중…</h2>
      <form class="unlock" id="ps-form" hidden><input type="password" id="ps-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호"><button type="submit">열기</button></form>
      <p class="hint" id="ps-msg"></p></div>
  </section>
  <div id="ps-main" hidden>
    <div class="ps-line" id="ps-line"></div>
    <section class="card" id="ps-cgc"><h2>도금</h2>
      <div class="ps-lg"><span><i style="background:var(--c-conf)"></i>작업지시</span><span><i style="background:var(--c-plan)"></i>소재 있음</span><span><i style="background:repeating-linear-gradient(135deg, var(--c-plan) 0 2px, var(--c-fcst) 2px 5px)"></i>입고 예정</span><b class="sep"></b><span><i style="background:var(--g1)"></i>수출</span><span><i style="background:var(--g2)"></i>국내</span><span><i style="background:var(--g3)"></i>자동차</span><span><i style="background:var(--g4)"></i>자가재</span><b class="sep"></b><span><i style="background:var(--c-mc)"></i>M/C</span><span><i class="ln" style="background:var(--bad)"></i>확인 필요</span><span><i style="background:var(--c-act)"></i>실적</span></div>
      <div class="wk" id="ps-cal-cg"></div><div class="ps-day" id="ps-day-cg" hidden></div></section>
    <section class="card" id="ps-ccc"><h2>컬러</h2>
      <div class="ps-lg"><span><i class="kw"></i>작업대기</span><span><i class="kc"></i>이어짐</span><span><i class="ky"></i>지시대기</span><span><i class="kb"></i>도료 미입고</span><span><i class="kg"></i>계획편성</span><b class="sep"></b><span><i style="background:var(--g1)"></i>수출</span><span><i style="background:var(--g2)"></i>내수</span><span><i style="background:var(--g0)"></i>기타</span><b class="sep"></b><span><i class="ln" style="background:var(--bad)"></i>작업대기 부족</span><span><i style="background:var(--c-act)"></i>실적</span></div>
      <div class="wk" id="ps-cal-cc"></div><div class="ps-day" id="ps-day-cc" hidden></div></section>
    <section class="card" id="ps-editc"><h2>작업 순서 수정</h2>
      <iframe id="ps-frame" title="작업 순서 수정" loading="eager"></iframe>
    </section>
  </div>
</main>
<footer class="foot"><div class="wrap"><span>자료 = 작업 순서 게시본(최근 저장·확정본)</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>
