<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편성</title>
<meta name="description" content="1주 작업지시 편성 — 주문 마감 · 소재 매치 · 라인 배분 · 작업 순서(보기 전용)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><clipPath id='c'><rect width='40' height='40' rx='11'/></clipPath></defs><g clip-path='url(%23c)'><rect width='40' height='40' fill='%231b3f5f'/><path d='M-6 30 30-6h9L3 30z' fill='%233774a1'/><path d='M4 40 40 4v9L13 40z' fill='%236cb1d8'/><path d='M17 40 40 17v8L25 40z' fill='%23fff'/></g></svg>">
<link rel="stylesheet" href="ui/theme.css?v=2611120306">
<style>
main.wrap { max-width: none; }
/* 편성 흐름 ① 주문 마감 → ② 소재 매치 → ③ 라인 배분 → ④ 작업 순서 */
.ps-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.ps-st { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 16px; min-width: 0; }
.ps-st .l { font-size: 15px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.ps-st .l i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-2); color: #fff; font-size: 13.5px; margin-right: 6px; }
.ps-st .v { font-size: 24px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; margin-top: 4px; }
.ps-st .v small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.ps-st .s { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 라인 배분 표 */
.ps-tw { overflow-x: auto; }
table.ps-sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.ps-sum :is(th, td) { padding: 10px 12px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); font-size: 16px; }
table.ps-sum thead th { font-size: 15px; font-weight: 700; background: var(--sub); }
table.ps-sum thead th.pl { font-size: 14.5px; color: var(--ink-2); font-weight: 600; }
table.ps-sum tbody th { font-size: 15px; font-weight: 700; color: var(--ink-2); text-align: left; }
table.ps-sum .ln { cursor: pointer; }
table.ps-sum .ln.on { box-shadow: inset 0 -3px 0 var(--brand-2); color: var(--brand-2); }
table.ps-sum td.ln.on { box-shadow: none; background: color-mix(in srgb, var(--brand-2) 7%, transparent); }
table.ps-sum td b { font-size: 18px; }
table.ps-sum td .st { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 14.5px; font-weight: 700; background: var(--grid); color: var(--ink-2); }
/* 작업 순서 목록 */
.ps-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 12px; }
.ps-bar .seg button { font-weight: 700; }
.ps-ver { font-size: 14.5px; color: var(--ink-2); white-space: nowrap; }
.ps-ver b { color: var(--ink); }
.ps-go { margin-left: auto; font-size: 15px; font-weight: 700; white-space: nowrap; }
table.ps-seq { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
table.ps-seq :is(th, td) { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 16px; text-align: center; vertical-align: middle; line-height: 1.5; }
table.ps-seq thead th { font-size: 15px; font-weight: 700; background: var(--sub); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
table.ps-seq td.no { font-weight: 800; }
table.ps-seq td.cn { white-space: nowrap; font-weight: 700; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; }
table.ps-seq td.sz, table.ps-seq td.t { white-space: nowrap; }
table.ps-seq :is(td, th).wy { text-align: left; word-break: keep-all; }
html.v2 body main table.ps-seq thead th.v2-l { text-align: left !important; }
table.ps-seq tr.dh td { background: var(--tint-2); text-align: left; font-size: 16px; padding: 10px 12px; border-top: 2px solid var(--line); }
table.ps-seq tr.dh b { margin-right: 14px; white-space: nowrap; }
table.ps-seq tr.dh span { color: var(--ink-2); white-space: nowrap; }
.cp { display: inline-block; border-radius: 5px; padding: 0 7px; font-size: 15px; font-weight: 700; white-space: nowrap; background: var(--tint-2); color: var(--ink); margin: 1px 2px; }
.cp.al { background: var(--gt-g); color: var(--gc-g); } .cp.cl { background: var(--gt-c); color: var(--gc-c); } .cp.wr { background: var(--warn-bg); color: var(--warn); }
.wy .sm { font-weight: 700; } .wy .ch { color: var(--ink-2); font-size: 14.5px; }
.ps-empty { padding: 18px 4px; color: var(--ink-2); font-size: 16px; }
@media (max-width: 1100px) { .ps-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 좁은 화면: 한 작업 = 한 묶음(순번·계약 → 사양 → 톤 → 이유) */
@media (max-width: 760px) {
  .ps-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ps-st { padding: 10px 12px; } .ps-st .v { font-size: 20px; } .ps-st .v small { font-size: 14px; } .ps-st .s { font-size: 13.5px; }
  .ps-go { margin-left: 0; }
  table.ps-seq, table.ps-seq tbody { display: block; width: 100%; }
  table.ps-seq thead, table.ps-seq colgroup { display: none; }
  table.ps-seq tr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  table.ps-seq td { display: block; padding: 0; border: 0; text-align: left; }
  table.ps-seq tr.dh { background: var(--tint-2); border-top: 2px solid var(--line); padding: 9px 8px; }
  table.ps-seq tr.dh td { padding: 0; border: 0; background: none; }
  table.ps-seq td.cn { flex: 1 1 auto; min-width: 0; }
  table.ps-seq td.sp { flex: 1 1 100%; }
  table.ps-seq td.wy { flex: 1 1 100%; }
  html.v2 body main table.ps-seq:not(.v2-grid) tbody td { padding: 0 !important; border: 0 !important; text-align: left !important; }
  html.v2 body main table.ps-seq:not(.v2-grid) tbody td.no::after { content: '.'; }
}
</style>
</head>
<body>
<header id="shell" data-page="pyeonseong" data-crumb="편성" data-title="편성"></header>
<main class="wrap">
  <section class="card lock" id="ps-lock">
    <div><div class="ic" aria-hidden="true">🔒</div><h2>불러오는 중…</h2>
      <form class="unlock" id="ps-form" hidden><input type="password" id="ps-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호"><button type="submit">열기</button></form>
      <p class="hint" id="ps-msg"></p></div>
  </section>
  <div id="ps-main" hidden>
    <div class="ps-flow" id="ps-flow"></div>
    <section class="card" id="ps-sumc"><h2>라인 배분</h2><div class="ps-tw"><table class="ps-sum" id="ps-sum"></table></div></section>
    <section class="card" id="ps-seqc"><h2>작업 순서</h2>
      <div class="ps-bar"><div class="seg" id="ps-lines"></div><span class="ps-ver" id="ps-ver"></span><a class="ps-go" id="ps-go" href="week_seq.html">작업 순서 화면에서 수정 →</a></div>
      <div id="ps-list"></div>
    </section>
  </div>
</main>
