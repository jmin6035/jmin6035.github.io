<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편성</title>
<meta name="description" content="이번 생산주 라인별 편성(지난 날 = 실적) — 칸을 누르면 그날 작업 순서 · 아래 = 작업 순서 수정">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><clipPath id='c'><rect width='40' height='40' rx='11'/></clipPath></defs><g clip-path='url(%23c)'><rect width='40' height='40' fill='%231b3f5f'/><path d='M-6 30 30-6h9L3 30z' fill='%233774a1'/><path d='M4 40 40 4v9L13 40z' fill='%236cb1d8'/><path d='M17 40 40 17v8L25 40z' fill='%23fff'/></g></svg>">
<link rel="stylesheet" href="ui/theme.css?v=2611120206">
<style>
main.wrap { max-width: none; }
html.v2 #ui-ctl { display: none !important; }   /* 11/12: 공통 관제 알약 줄은 편성과 상관없어 숨김 */
/* 11/12 사용자 '편성 더 이쁘게 간략하게': 위 = 이번 생산주(수~화) 라인별 캘린더(생산 일정 화면과 같은 칸 — cg_calendar·cc_calendar 그대로) · 칸 누르면 그날 작업 순서 · 아래 = 작업 순서 수정
   글자 3단계: 큰 톤 20px · 본문 16px · 보조 14px — 모두 가운데 */
#ps-main { font-size: 16px; text-align: center; }
:root { --c-conf: #2e7d32; --c-plan: #3774a1; --c-fcst: #8fb8dc; --c-gap: #f4f6f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-conf: #4caf50; --c-plan: #5b9bd0; --c-fcst: #2f4f6c; --c-gap: #2a3038; } }
:root[data-theme="dark"] { --c-conf: #4caf50; --c-plan: #5b9bd0; --c-fcst: #2f4f6c; --c-gap: #2a3038; }
#ps-main .card > h2 { font-size: 16px !important; font-weight: 800; text-align: center; justify-content: center; }
html.v2 main #ps-main .xbtn { font-size: 14px !important; }
.ps-line { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 22px; margin: 4px 0 16px; font-size: 16px; color: var(--ink-2); }
.ps-line b { color: var(--ink); font-weight: 800; } .ps-line .ar { color: var(--ink-3); }
.ps-lg { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; font-size: 14px; color: var(--ink-2); margin: 0 0 10px; }
.ps-lg span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ps-lg i { display: inline-block; width: 20px; height: 11px; border-radius: 3px; }
/* 캘린더 칸(생산 일정 화면 ct_plan.html 과 같은 모양) */
.wk { overflow-x: auto; }
table.cg { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; table-layout: fixed; }
table.cg th, table.cg td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; vertical-align: top; height: 1px; }
html.v2 body main #ps-main table.cg tbody tr:not(.dsum) > td:not(.jg) { padding: 0 !important; vertical-align: top !important; }
table.cg td > button.cell { height: 100%; } button.cell > * { flex-shrink: 0; }
table.cg tr > :first-child { border-left: 1px solid var(--line); width: 104px; }
html.v2 body main #ps-main table.cg thead th { background: var(--brand) !important; color: var(--on-brand, #fff) !important; font-size: 16px !important; font-weight: 800 !important; padding: 8px 4px !important; white-space: nowrap; }
html.v2 body main #ps-main table.cg thead th.wl { background: #3d4a5c !important; line-height: 1.3 !important; }
html.v2 body main #ps-main table.cg thead th.pst { background: var(--sub) !important; color: var(--ink-2) !important; }
html.v2 body main #ps-main table.cg thead th small { display: block; font-size: 14px !important; font-weight: 600 !important; color: inherit !important; opacity: .9; }
html.v2 body main #ps-main table.cg thead th small.tdy { display: inline-block; margin: 0 0 0 6px; padding: 0 7px; border-radius: 999px; background: #fff; color: var(--brand) !important; font-weight: 800 !important; opacity: 1; }
html.v2 body main #ps-main table.cg thead th.pst small.tdy { background: var(--ink-3) !important; color: #fff !important; }
table.cg .pad { background: transparent !important; border: 0 !important; }
html.v2 body main #ps-main table.cg tbody th { background: var(--tint-2) !important; font-size: 16px !important; font-weight: 800; padding: 10px 4px !important; word-break: keep-all; vertical-align: middle !important; }
html.v2 body main #ps-main table.cg tbody th small { display: block; font-size: 14px !important; font-weight: 600; color: var(--ink-2); }
table.cg td.pst { background: var(--sub); }
button.cell { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; min-height: 120px; border: 0; background: var(--surface); color: var(--ink); font: inherit; text-align: center; padding: 8px 8px 10px; cursor: pointer; }
button.cell:hover { background: var(--hover); }
button.cell.on { box-shadow: inset 0 0 0 3px var(--brand-2); }
button.cell.fl { background: color-mix(in srgb, var(--bad-bg) 55%, var(--surface)); box-shadow: inset 4px 0 0 var(--bad); }
button.cell.fl.on { box-shadow: inset 4px 0 0 var(--bad), inset 0 0 0 3px var(--brand-2); }
button.cell.mc { background: #fff3bf; } button.cell.mc:hover { background: #ffec99; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.cell.mc { background: #4a3f12; } }
:root[data-theme="dark"] button.cell.mc { background: #4a3f12; }
button.cell.stp { background: var(--tint-2); cursor: default; }
.ct { display: flex; justify-content: center; align-items: center; gap: 5px; margin: 0 0 6px; flex-wrap: wrap; min-height: 22px; }
.fam, .ev { display: inline-block; border-radius: 5px; padding: 0 7px; font-size: 14px; font-weight: 800; white-space: nowrap; }
.ev { background: #f59f00; color: #2b1a00 !important; }
.fam-AL { background: #e6f0fb; color: #1d5a96; } .fam-AZ { background: #eef6e8; color: #3d6b1f; } .fam-MAC { background: #f3ecfb; color: #5b2f8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fam-AL { background: #1d3550; color: #9cc6f0; } :root:not([data-theme="light"]) .fam-AZ { background: #23381a; color: #b5dc95; } :root:not([data-theme="light"]) .fam-MAC { background: #34244a; color: #d2b6f2; } }
:root[data-theme="dark"] .fam-AL { background: #1d3550; color: #9cc6f0; } :root[data-theme="dark"] .fam-AZ { background: #23381a; color: #b5dc95; } :root[data-theme="dark"] .fam-MAC { background: #34244a; color: #d2b6f2; }
.bar { display: flex; flex-wrap: nowrap; gap: 0; align-self: stretch; height: 10px; border-radius: 3px; overflow: hidden; background: var(--c-gap); box-shadow: inset 0 0 0 1px var(--line); margin: 0 0 7px; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--c-conf); } .bar .p { background: var(--c-plan); } .bar .f { background: repeating-linear-gradient(135deg, var(--c-plan) 0 2px, var(--c-fcst) 2px 5px); }
.bar .kw, i.kw { background: #44546a; } .bar .ky, i.ky { background: #e0a800; } .bar .kb, i.kb { background: #2a78d6; } .bar .kg, i.kg { background: #2e7d32; }
.bar .kc, i.kc { background: repeating-linear-gradient(135deg, #44546a 0 2px, #c3cad4 2px 5px); }
.tv { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.tv small, .tv .hv { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.gl { font-size: 14px; line-height: 1.55; margin-top: 3px; font-variant-numeric: tabular-nums; }
.gl span { display: block; white-space: nowrap; }
.gl .kwt { color: var(--ink); } .gl .kyt { color: #8a6500; } .gl .kbt { color: #1f5fae; } .gl .kgt { color: #2e7d32; } .gl .kct { color: var(--ink-2); } .gl .klt { color: var(--brand-2); font-weight: 700; }
.fg, .sh { font-size: 14px; font-weight: 800; color: var(--bad); margin-top: 4px; line-height: 1.35; word-break: keep-all; }
.sh small { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.lt { font-size: 14px; font-weight: 700; color: var(--warn); margin-top: 2px; word-break: keep-all; line-height: 1.35; }
.mvc { font-size: 14px; font-weight: 800; color: var(--brand-2); }
html.v2 body main #ps-main tr.dsum td { background: var(--tint-2) !important; font-variant-numeric: tabular-nums; vertical-align: middle !important; }
tr.dsum td small, tr.dsum td .sub { font-size: 14px !important; color: var(--ink-2); font-weight: 400; }
html.v2 body main #ps-main table.cg td.jg { font-size: 14px !important; padding: 8px 10px !important; line-height: 1.5 !important; font-variant-numeric: tabular-nums; }
td.jg b { font-size: 16px; } td.jg .jr { display: flex; justify-content: center; gap: 10px; } td.jg .jr span { color: var(--ink-2); }
td.jg .jr.bad b, td.jg .jr.bad span { color: var(--bad); font-weight: 800; } td.jg .jr.good b, td.jg .jr.good span { color: var(--good); }
td.jg .mk { display: inline-block; font-size: 14px; background: var(--tint-2); border-radius: 4px; padding: 0 6px; margin-top: 2px; white-space: nowrap; }
/* 칸 누르면 = 그날 작업 순서 */
.ps-day { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ps-dh { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; padding: 10px 14px; background: var(--tint-2); font-size: 16px; }
.ps-dh b { font-weight: 800; } .ps-dh span { color: var(--ink-2); }
.ps-dh button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 6px; padding: 2px 12px; cursor: pointer; }
table.ps-seq { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
html.v2 body main table.ps-seq:not(.v2-grid) :is(td, th) { padding: 8px 10px !important; font-size: 16px !important; line-height: 1.5 !important; text-align: center !important; }
html.v2 body main table.ps-seq:not(.v2-grid) thead th { font-size: 14px !important; }
table.ps-seq :is(th, td) { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 16px; text-align: center; vertical-align: middle; }
table.ps-seq td.no { white-space: nowrap; font-weight: 600; }
table.ps-seq td.cn, table.ps-seq td.sz, table.ps-seq td.t, table.ps-seq td.dl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.ps-seq tr.fx td { font-weight: 800; }
table.ps-seq tr.lt td.dl { color: var(--warn); font-weight: 800; }
i.kd { display: inline-block; font-style: normal; border-radius: 10px; padding: 0 10px; font-size: 14px; font-weight: 800; white-space: nowrap; color: #fff; line-height: 1.6; }
i.kd.k1 { background: var(--c-conf); } i.kd.k2 { background: var(--c-plan); } i.kd.k3 { background: var(--c-fcst); color: var(--ink); }
i.kd.w1 { background: #44546a; } i.kd.w2 { background: #e0a800; color: #2b1a00; } i.kd.w3 { background: #2a78d6; } i.kd.w4 { background: #2e7d32; }
.cp { display: inline-block; border-radius: 5px; padding: 0 7px; font-size: 14px; font-weight: 700; white-space: nowrap; background: var(--tint-2); margin: 1px 2px; }
.cp.al { background: #e6f0fb; color: #1d5a96; } .cp.cl { background: var(--sub); }
.ps-empty { padding: 16px; color: var(--ink-2); font-size: 16px; }
#ps-frame { display: block; width: 100%; border: 0; height: 900px; background: transparent; }
@media (max-width: 760px) {
  table.ps-seq colgroup, table.ps-seq thead { display: none; }
  table.ps-seq, table.ps-seq tbody { display: block; }
  table.ps-seq tr { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  table.ps-seq td { display: block; border: 0; padding: 0 !important; }
}
</style>
</head>
<body>
<header id="shell" data-page="pyeonseong" data-crumb="편성" data-title="편성"></header>
<main class="wrap">
  <section class="card lock" id="ps-lock">
    <div><div class="ic" aria-hidden="true">🔒</div><h2>불러오는 중…</h2>
      <form class="unlock" id="ps-form" hidden><input type="password" id="ps-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호"><button type="submit">열기</button></form>
      <p class="hint" id="ps-msg"></p></div>
  </section>
  <div id="ps-main" hidden>
    <div class="ps-line" id="ps-line"></div>
    <section class="card" id="ps-cgc"><h2>도금</h2>
      <div class="ps-lg"><span><i style="background:var(--c-conf)"></i>작업지시</span><span><i style="background:var(--c-plan)"></i>소재 있음</span><span><i class="f" style="background:repeating-linear-gradient(135deg, var(--c-plan) 0 2px, var(--c-fcst) 2px 5px)"></i>입고 예정</span><span><i style="background:#fff3bf;box-shadow:inset 0 0 0 1px #f59f00"></i>M/C</span><span><i style="background:var(--bad)"></i>확인 필요</span><span><i style="background:var(--ink-2)"></i>실적</span></div>
      <div class="wk" id="ps-cal-cg"></div><div class="ps-day" id="ps-day-cg" hidden></div></section>
    <section class="card" id="ps-ccc"><h2>컬러</h2>
      <div class="ps-lg"><span><i class="kw"></i>작업대기</span><span><i class="kc"></i>이어짐</span><span><i class="ky"></i>지시대기</span><span><i class="kb"></i>도료 미입고</span><span><i class="kg"></i>계획편성</span><span><i style="background:var(--bad)"></i>작업대기 부족</span><span><i style="background:var(--ink-2)"></i>실적</span></div>
      <div class="wk" id="ps-cal-cc"></div><div class="ps-day" id="ps-day-cc" hidden></div></section>
    <section class="card" id="ps-editc"><h2>작업 순서 수정</h2>
      <iframe id="ps-frame" title="작업 순서 수정" loading="eager"></iframe>
    </section>
  </div>
</main>
<footer class="foot"><div class="wrap"><span>자료 = 작업 순서 게시본(최근 저장·확정본)</span><span>POSCO STEELEON 도금·컬러 가동계획</span></div></footer>

<script src="engine/crypto.js?v=2611120206"></script>
<script src="ui/ct.js?v=2611120206"></script>
<script src="cg_calendar.js?v=2611120207"></script>
<script src="cc_calendar.js?v=2611120207"></script>

</body>
