:root[data-theme="dark"] { --wk-bad: #f2777b; --wk-warn: #f0a646; --m-ok: #2f9e60; --m-stock: #4f86ad; --m-on: #4f9a6c; --m-wait1: #4b5563; --m-wait2: #374151; --wk-row: #1b2430; --wk-sec: #334155; --m-late: #d08a2e; --m-none: #e0565b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wk-bad: #f2777b; --wk-warn: #f0a646; --m-ok: #2f9e60; --m-stock: #4f86ad; --m-on: #4f9a6c; --m-wait1: #4b5563; --m-wait2: #374151; --wk-row: #1b2430; --wk-sec: #334155; --m-late: #d08a2e; --m-none: #e0565b; } }

.wk-dash .wh b { display: block; font-size: 15.5px; font-weight: 800; } .wk-dash .wh small { font-size: 13.5px; color: #cbd5e1; }
.wk-dash .wh.nx { background: var(--wk-nx); } .wk-dash .wh.sel { border-color: #fbbf24; }
.wk-dash .pl { border-radius: 8px; color: #fff; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.wk-dash .pl.G { background: var(--wk-g); } .wk-dash .pl.C { background: var(--wk-c); }
.wk-dash .wkc { display: block; background: var(--surface); border: 1px solid var(--v2-line, var(--line)); border-radius: 8px; padding: 6px 8px; cursor: pointer; min-width: 0; }
.wk-dash .wkc.sel { border: 2px solid #fbbf24; padding: 5px 7px; }
.wk-dash .wkc .v { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; line-height: 1.25; }
.wk-dash .wkc .v b { font-size: 20px; font-weight: 800; } .wk-dash .wkc .v small { font-size: 13.5px; color: var(--ink-2); }
.wk-dash .wkc .na { font-size: 14px; color: var(--ink-2); padding: 18px 0; }
.wk-dash .wkc .t { font-size: 13.5px; color: var(--ink-2); }
.sb { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 5px 0 3px; }
.sb i { display: block; height: 100%; box-shadow: inset -2px 0 0 var(--surface); } .sb .ok { background: var(--m-ok); } .sb .stock { background: var(--m-stock); } .sb .on { background: var(--m-on); } .sb .late { background: var(--m-late); }
.sb .wait { background: repeating-linear-gradient(135deg, var(--m-wait1) 0 4px, var(--m-wait2) 4px 8px); } .sb .none { background: var(--m-none); } .sb .no { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--m-none); }
.wk-lf { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 22px; justify-content: center; font-size: 15px; background: var(--surface); border: 1px solid var(--v2-line, var(--line)); border-radius: 8px; padding: 7px 12px; }
.wk-lf span { font-weight: 800; } .wk-lf em { font-style: normal; color: var(--ink-2); } .wk-lf b { color: var(--wk-bad); }
.wk-h2 { font-size: 19px; font-weight: 800; margin: 16px 0 4px; text-align: left; } .wk-h2 small { font-size: 15px; color: var(--ink-2); font-weight: 500; margin-left: 8px; }
table.wk-t td, table.wk-t thead th { white-space: normal; } .wk-scroll { overflow-x: auto; }
table.wk-t { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 4px; }
table.wk-t thead th { font-size: 14px; color: var(--ink-2); font-weight: 700; padding: 2px; }
table.wk-t tbody th { font-size: 16px; font-weight: 800; color: #fff; border-radius: 8px 0 0 8px; } table.wk-t th.G { background: var(--wk-g); } table.wk-t th.C { background: var(--wk-c); }
table.wk-t tbody td { background: var(--surface); padding: 6px 10px; font-size: 16px; font-variant-numeric: tabular-nums; } table.wk-t tbody tr td:last-child { border-radius: 0 8px 8px 0; }
table.wk-t td b { font-size: 17px; } table.wk-t td span.s { font-size: 14px; color: var(--ink-2); margin-left: 4px; }
table.wk-t tr.ds th { background: none; color: var(--ink-2); font-size: 14px; font-weight: 700; text-align: right; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.wk-t tr.ds td { background: var(--wk-row); font-size: 14px; padding: 3px 10px; } table.wk-t tr.ds td b { font-size: 15px; }
table.wk-t td.pr { font-size: 14px; color: var(--ink-2); text-align: left; } table.wk-t td.pr b { font-size: 15px; }
table.wk-t td.tx { overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; text-align: left; font-size: 14px; color: var(--ink-2); line-height: 1.7; } table.wk-t td.tx b { color: var(--ink); font-size: 14px; }
table.wk-t tr.g { cursor: pointer; } table.wk-t tr.g th::after { content: ' ▾'; font-size: 12px; opacity: .8; } table.wk-t tr.g.cl th::after { content: ' ▸'; }
table.wk-t td.nap { color: var(--ink-2); }
.bad { color: var(--wk-bad) !important; } .warn { color: var(--wk-warn) !important; } .mu { color: var(--ink-2); }
.wk-lg { font-size: 14px; color: var(--ink-2); margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }
.wk-lg i { display: inline-block; width: 16px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.wk-ft { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }

  .wk-scroll { overflow-x: auto; } table.wk-t { min-width: 820px; }
