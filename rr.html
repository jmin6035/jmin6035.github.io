<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무분장 협의</title>
<meta name="description" content="판생, 수주, 공정출하 세부 업무별 현재 담당과 향후 담당 협의">
<link rel="stylesheet" href="ui/theme.css?v=8635288151">
<style>
.rr-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin: 0 0 12px; }
.rr-cnt { font-size: 15px; color: var(--ink-2); } .rr-cnt b { font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; margin: 0 2px; }
.rr-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rr-bar input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 150px; }
.rr-st { font-size: 13.5px; color: var(--ink-2); min-width: 120px; }
.rr-st.err { color: var(--warn); font-weight: 700; }
.rr-g h2 { display: flex; align-items: center; gap: 8px; }
.rr-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.rr-job { border-top: 1px solid var(--line); padding: 14px 0 8px; }
.rr-job:first-of-type { border-top: 0; }
.rr-jh { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 380px); gap: 8px 14px; align-items: start; margin-bottom: 8px; }
.rr-no { color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.rr-nm { font-weight: 700; font-size: 16px; }
.rr-ds { color: var(--ink-2); font-size: 14px; margin-top: 2px; word-break: keep-all; }
.rr-lb { font-size: 13.5px; color: var(--ink-2); font-weight: 700; margin-bottom: 2px; }
.rr-who { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.rr-who span { font-weight: 700; } .rr-who small { color: var(--ink-2); font-size: 13.5px; display: block; word-break: keep-all; }
table.rr-t { width: 100%; border-collapse: collapse; table-layout: fixed; }
.rr-t th { font-size: 13.5px; color: var(--ink-2); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.rr-t td { padding: 6px 8px; border-bottom: 1px solid var(--line-2, var(--line)); vertical-align: middle; font-size: 14px; }
.rr-t tr:last-child td { border-bottom: 0; }
.rr-t .c-n { width: 48px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rr-t .c-s { width: 30%; } .rr-t .c-now { width: 24%; } .rr-t .c-nx { width: 17%; }
.rr-sn { display: flex; gap: 6px; align-items: center; justify-content: center; } .rr-t td { white-space: normal !important; } .rr-sn span { word-break: keep-all; overflow-wrap: anywhere; }
.rr-sn input { flex: 1; min-width: 0; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.rr-ed { border: 0; background: none; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 13.5px; padding: 2px 4px; flex: none; text-decoration: underline; }
.rr-ops { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.rr-op { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.rr-op:hover { border-color: var(--ink-2); }
.rr-op[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rr-memo { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); min-height: 32px; resize: vertical; }
.rr-by { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.rr-add { margin: 6px 0 0 48px; display: flex; gap: 6px; }
.rr-add input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 260px; max-width: 60vw; }
.rr-ot td:nth-child(2) .rr-nm { font-size: 15px; }
.rr-ot .c-o { width: 26%; } .rr-ot .c-c { width: 20%; }
@media (max-width: 900px) {
  .rr-jh { grid-template-columns: 28px minmax(0, 1fr); } .rr-jh .rr-jn { grid-column: 2; }
  table.rr-t, .rr-t tbody, .rr-t tr, .rr-t td { display: block; width: auto !important; }
  .rr-t thead { display: none; } .rr-t tr { border-bottom: 1px solid var(--line); padding: 6px 0; } .rr-t td { border: 0; padding: 3px 2px; }
  .rr-t td[data-l]::before { content: attr(data-l); display: block; font-size: 13.5px; color: var(--ink-2); font-weight: 700; }
  .rr-t td { display: block !important; } .rr-t td.c-n { font-weight: 700; }
  .rr-bar { width: 100%; } .rr-bar input { flex: 1; min-width: 120px; }
  .rr-add { margin-left: 0; }
}
@media print { .rr-bar, .rr-add, .rr-ed { display: none !important; } .rr-memo { border-color: #bbb; } .rr-job { break-inside: avoid; } }
</style>
</head>

      <form class="unlock" id="rr-form" hidden><input type="password" id="rr-pw" placeholder="분석 암호" autocomplete="current-password" aria-label="분석 암호"><button type="submit">열기</button></form>
      <p class="hint" id="rr-msg"></p></div></section>
  </div>

</html>
