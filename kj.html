<style>
/* 관제(5차) — 글자 3단계만: 큰 숫자 34 · 제목 18 · 본문 16(표·그래프 라벨·캘린더·범례 모두) / 간격 16px / 모든 글자 가운데 */
main.wrap { max-width: none; }

:root[data-theme="dark"] { --kj-ac: #3a7fe0; --kj-stk: #aab3be; --kj-ov: #d95926; --kj-ovt: #f2884f; --kj-tk: #f2f5f8; --kj-sl: #667085; }
:root { --kj-pl: color-mix(in srgb, var(--kj-ac) 14%, var(--surface)); --kj-spl: color-mix(in srgb, var(--kj-stk) 12%, var(--surface)); }
#ct-main, #ct-main * { font-size: 16px; }
#ct-main { text-align: center; }
.kj-c { background: var(--surface); border: 1px solid var(--v2-line, var(--line)); border-radius: 10px; padding: var(--kj-g); min-width: 0; }
#ct-main .kj-c h3 { margin: 0 0 8px; font-size: 18px; font-weight: 700; color: var(--ink); text-align: center; }
#ct-main .kj-c h3 small, #ct-main .kj-h small { font-size: 16px !important; font-weight: 500 !important; color: var(--ink-2); margin-left: 8px; }

.kj-c .na, .kj-c td.na, .kj-k .na { color: var(--ink-2); font-weight: 500; }

/* 0. 달 탭 + 기준 한 줄 — 가운데 */

.kj-tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--v2-line, var(--line)); border-radius: 12px; background: var(--surface); }
#ct-main .kj-tabs button { font: inherit; font-size: 18px; font-weight: 800; color: var(--ink-2); background: none; border: 0; border-radius: 9px; padding: 9px 28px; cursor: pointer; white-space: nowrap; }
#ct-main .kj-tabs button span { font-size: 16px; font-weight: 600; }
#ct-main .kj-tabs button[aria-selected="true"] { background: var(--brand-2); color: #fff; }
#ct-main .kj-tabs button:not([aria-selected="true"]):hover { background: var(--hover); color: var(--ink); }
.kj-basis { margin: 0; color: var(--ink-2); word-break: keep-all; }
.kj-why { margin: 0; font-weight: 700; color: var(--ink); word-break: keep-all; }

/* 1. 운영 일정 */
.kj-sch ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.kj-sch li { padding: 4px 8px; border-left: 1px solid var(--v2-line, var(--line)); text-align: center; line-height: 1.45; word-break: keep-all; color: var(--ink); }
.kj-sch li:first-child { border-left: 0; }

.kj-sch li.done { color: var(--ink-2); } .kj-sch li.done b { font-weight: 500; }
.kj-sch li.now { font-weight: 700; } .kj-sch li.now b span { color: var(--brand-2); }

/* 2. 결론 카드 */
.kj-k4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--kj-g); margin: var(--kj-g) 0; }

a.kj-kl:hover .ct-kpi { border-color: var(--kj-ac) !important; }
html.v2 main .ct-kpi.kj-k > .l { font-size: 18px !important; color: var(--ink) !important; white-space: nowrap; }
html.v2 main .ct-kpi.kj-k > .l small { font-size: 16px !important; font-weight: 500; color: var(--ink-2); }
html.v2 main .ct-kpi.kj-k > .v { font-size: 34px !important; color: var(--ink); margin: 2px 0; }
html.v2 main .ct-kpi.kj-k > .v small { font-size: 16px !important; }
html.v2 main .ct-kpi.kj-k > .v.bad { color: var(--bad) !important; } html.v2 main .ct-kpi.kj-k > .v.ov { color: var(--kj-ovt) !important; }

.kj-wh { line-height: 1.6; font-variant-numeric: tabular-nums; } .kj-wh b { color: var(--ink); }

/* 범례 한 줄 */
.kj-lg { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; margin: 0 0 12px; color: var(--ink-2); }
.kj-lg span { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.kj-lg i { display: inline-block; width: 16px; height: 14px; border-radius: 3px; }
.kj-lg i.ov { background: var(--kj-ov); } .kj-lg i.sbg { background: var(--kj-spl); box-shadow: inset 0 0 0 1px var(--kj-stk); } .kj-lg i.ac { background: var(--kj-ac); } .kj-lg i.stk { background: var(--kj-stk); } .kj-lg i.sl { background: var(--kj-sl); }
.kj-lg i.pl { background: var(--kj-pl); box-shadow: inset 0 0 0 1px var(--kj-ac); } .kj-lg i.e { background: var(--surface); box-shadow: inset 0 0 0 2px var(--bad); } .kj-lg i.q { background: var(--surface); border: 1px dashed var(--ink-2); }
.kj-lg i.tk { height: 3px; width: 22px; border-radius: 0; background: var(--kj-tk); }
.kj-lg i.tkd { height: 0; width: 22px; border-radius: 0; border-top: 3px dashed var(--kj-tk); }
.kj-lg i.cpa { background: color-mix(in srgb, var(--kj-ac) 10%, var(--surface)); box-shadow: inset 0 0 0 1px var(--v2-line, var(--line)); } .kj-lg i.cpl { background: var(--surface); box-shadow: inset 0 0 0 1px var(--v2-line, var(--line)); }

.kj-lg.in { margin: 12px 0 0; } .kj-h + .kj-lg.in { margin: 0 0 12px; }

.kj-gg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--kj-g); }
@media (max-width: 1100px) { .kj-two { grid-template-columns: minmax(0, 1fr); } }
.kj-ch { width: 100%; }
.kj-svg { display: block; width: 100%; height: auto; overflow: visible; font-variant-numeric: tabular-nums; }
.kj-svg text { fill: var(--ink); pointer-events: none; font-size: 16px; }
.kj-svg text.l1 { font-weight: 800; } .kj-svg text.l1.bad { fill: var(--bad); } .kj-svg text.l1.ov { fill: var(--kj-ovt); }
.kj-svg text.l2 { font-weight: 600; fill: var(--ink-2); }
.kj-svg text.nm { font-weight: 700; }
.kj-svg text.na { font-weight: 500; fill: var(--ink-2); }
.kj-svg .base { stroke: var(--ink-2); stroke-width: 1; }
.kj-svg path { pointer-events: none; }
.kj-svg .slb, .kj-svg .bp { fill: var(--kj-sl); } .kj-svg .ba { fill: var(--kj-ac); } .kj-svg .bs { fill: var(--kj-stk); } .kj-svg .bo { fill: var(--kj-ov); }
.kj-svg text.vp { font-weight: 600; fill: var(--ink-2); } .kj-svg text.va { font-weight: 700; } .kj-svg text.pc { font-weight: 800; } .kj-svg text.pc.bad { fill: var(--bad); } .kj-svg text.pc.ov { fill: var(--kj-ovt); }
.kj-svg .fbg { fill: var(--kj-pl); stroke: var(--kj-ac); stroke-width: 1; } .kj-svg .ffill { fill: var(--kj-ac); }
.kj-svg .sbg { fill: var(--kj-spl); stroke: var(--kj-stk); stroke-width: 1; } .kj-svg .sfill { fill: var(--kj-stk); } .kj-svg .over { fill: var(--kj-ov); }
.kj-svg .tk { stroke: var(--kj-tk); stroke-width: 3; pointer-events: none; } .kj-svg .tk.d { stroke-dasharray: 5 3; }

.kj-svg .hit:hover, .kj-svg .hit:focus-visible { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
#kj-tip { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--v2-line, var(--line)); border-radius: 8px; box-shadow: 0 6px 20px rgba(16, 24, 40, .16); padding: 10px 14px; font-size: 16px; pointer-events: none; min-width: 200px; text-align: center; }
#kj-tip .t { font-weight: 700; color: var(--ink-2); margin: 0 0 6px; }
#kj-tip .r { display: flex; justify-content: center; gap: 10px; align-items: baseline; line-height: 1.6; } #kj-tip .r b { color: var(--ink); white-space: nowrap; } #kj-tip .r span { color: var(--ink-2); }

/* 표(매트릭스·소재 표·조치): 모두 가운데 · 16px */
.kj-tb { padding: 0; overflow: hidden; }
.kj-c table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
html.v2 body main #ct-main .kj-c table :is(th, td), html.v2 body main #ct-main .kj-c table :is(th, td) small { text-align: center !important; white-space: nowrap; font-size: 16px !important; }

html.v2 body main .kj-mx .gs { border-left: 1px solid var(--v2-line, var(--line)) !important; }
html.v2 body main .kj-mx tr.pt { background: color-mix(in srgb, var(--ink) 4%, var(--surface)); } html.v2 body main .kj-mx tr.pt :is(th, td) { font-weight: 700 !important; background: transparent !important; }
html.v2 body main .kj-mx tr.tot :is(th, td) { font-weight: 800 !important; border-top: 2px solid var(--ink-2) !important; }
.kj-c td.kp { font-weight: 700; }
html.v2 body main .kj-mx tbody th, html.v2 body main .kj-mx thead tr:first-child th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface) !important; box-shadow: inset -1px 0 0 var(--v2-line, var(--line)); }

html.v2 body main .kj-mx td.ov { font-weight: 700; }
html.v2 body main #ct-main .kj-mx td small.kj-mna { display: block; white-space: normal; font-weight: 500; color: var(--ink-2); }   /* 공장 소재 = 그룹 합 + 미배정(DUMMY/포장재) */
@media (max-width: 1500px) { html.v2 body main #ct-main .kj-mx :is(th, td) { padding: 9px 3px !important; } html.v2 body main #ct-main .kj-mx tbody th { padding: 9px 8px !important; } html.v2 body main #ct-main .kj-mx thead th { white-space: normal !important; word-break: keep-all; } }

/* 6. 소재 */
.kj-ms { display: grid; gap: 14px; }
.kj-ms .row { display: grid; grid-template-columns: 220px minmax(0, 1fr) 260px; align-items: center; gap: var(--kj-g); }
.kj-ms .nm { text-align: center; white-space: nowrap; line-height: 1.5; } .kj-ms .nm b { display: block; } .kj-ms .nm span { color: var(--ink-2); }
.kj-ms .bar { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 2px; height: 30px; margin: 0; }
.kj-ms .bar i { display: flex; align-items: center; justify-content: center; min-width: 4px; border-radius: 4px; overflow: hidden; font-style: normal; font-weight: 600; white-space: nowrap; }
.kj-ms .bar i span { padding: 0 6px; }
.kj-ms .bar i.r { background: var(--kj-ac); color: #fff; } .kj-ms .bar i.o { background: var(--kj-pl); box-shadow: inset 0 0 0 1px var(--kj-ac); color: var(--ink); }
.kj-ms .bar i.e { background: var(--surface); box-shadow: inset 0 0 0 2px var(--bad); color: var(--bad); } .kj-ms .bar i.q { background: var(--surface); border: 1px dashed var(--ink-2); color: var(--ink-2); }
.kj-ms .bar i:hover, .kj-ms .bar i:focus-visible { filter: brightness(1.06); outline: 2px solid var(--kj-tk); outline-offset: 1px; }
.kj-ms .bar em { margin: auto; font-style: normal; color: var(--ink-2); }
.kj-ms .pc { text-align: center; line-height: 1.5; } .kj-ms .pc b { display: block; } .kj-ms .pc span { color: var(--ink-2); white-space: nowrap; }
.kj-risk { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--v2-line, var(--line)); color: var(--ink-2); line-height: 1.6; }
.kj-risk > b { color: var(--ink); } .kj-risk span { white-space: nowrap; }
.kj-tv { margin: 12px 0 0; } .kj-tv summary { cursor: pointer; font-weight: 600; color: var(--ink-2); text-align: center; } .kj-tv table { margin-top: 8px; }

/* 7. 캘린더 — 16px · 31일이 1920 폭에 들어가게(첫 열 좁게, 칸 여백 최소) */
html body main table.kj-cal { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 1560px; font-variant-numeric: tabular-nums; }
html body main table.kj-cal :is(th, td) { border: 1px solid var(--v2-line, var(--line)); padding: 0 1px; text-align: center; font-size: 16px !important; line-height: 1.2; overflow: hidden; }

.kj-cal thead th b, .kj-cal thead th span { display: block; } .kj-cal thead th span { font-weight: 500; color: var(--ink-2); }
.kj-cal thead th.we :is(b, span) { color: var(--ink-2); }
html body main table.kj-cal .lab { width: 92px; position: sticky; left: 0; z-index: 1; background: var(--surface); padding: 2px 4px; }

html body main table.kj-cal.kjpa tbody tr.r2 :is(td, th) { height: 34px; }
html body main table.kj-cal td.pp { color: var(--ink-2); } html body main table.kj-cal td.aa { font-weight: 800; color: var(--ink); background: color-mix(in srgb, var(--kj-ac) 9%, var(--surface)); }
html body main table.kj-cal th.kd.ka { color: var(--kj-ac); }
html body main table.kj-cal :is(.lab.l1, td.o1) { border-bottom: 0 !important; } html body main table.kj-cal :is(.lab.l2, td.o2) { border-top: 0 !important; }
.kj-lg i.idl { background: #fff2a8; } .kj-lg i.now { background: color-mix(in srgb, var(--kj-ac) 26%, var(--surface)); box-shadow: inset 2px 0 0 var(--kj-ac), inset -2px 0 0 var(--kj-ac); } .kj-lg i.rep { background: #c0392b; }
html body main table.kj-cal .sumc { width: 72px; font-weight: 700; border-left: 2px solid color-mix(in srgb, var(--ink) 40%, var(--surface)) !important; } .kj-cal td.sumc b { font-weight: 800; }
html body main table.kj-cal tbody .lab { box-shadow: -12px 0 0 0 var(--surface); } html body main table.kj-cal tr.tot .lab { box-shadow: -12px 0 0 0 color-mix(in srgb, var(--ink) 4%, var(--surface)); }
html body main table.kj-cal thead .lab { box-shadow: -12px 0 0 0 var(--v2-th, var(--sub)); background: var(--v2-th, var(--sub)); font-weight: 600; white-space: normal; }
.kj-cal tbody .lab b { display: block; } .kj-cal tbody .lab span { display: block; color: var(--ink-2); white-space: nowrap; } .kj-cal tbody .lab span b { display: inline; color: var(--ink); }
html body main table.kj-cal tbody tr:not(.sec) td, html body main table.kj-cal tbody tr:not(.sec) th { height: 48px; }
.kj-cal td.pa span, .kj-cal td.pa b { display: block; } .kj-cal td.pa span { color: var(--ink-2); } .kj-cal td.pa b { color: var(--ink); }
.kj-cal td.pa { background: color-mix(in srgb, var(--kj-ac) 10%, var(--surface)); } .kj-cal td.pl { background: var(--surface); } .kj-cal td.pl b { font-weight: 600; }
.kj-cal td.id, .kj-cal td.nd { color: var(--ink-2); }
html body main table.kj-cal td.idl { background: #fff2a8; color: #5c4a00; font-weight: 700; text-align: center; white-space: nowrap; }
html body main table.kj-cal td.rep { background: #c0392b; color: #fff; font-weight: 700; text-align: center; white-space: nowrap; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) table.kj-cal td.idl { background: #5c4d0a; color: #fff3b0; } }
:root[data-theme="dark"] table.kj-cal td.idl { background: #5c4d0a; color: #fff3b0; }
html body main table.kj-cal tr.sec th { height: 36px; background: var(--v2-th, var(--sub)); text-align: center; font-weight: 700; border-top: 2px solid var(--v2-line, var(--line)); overflow: visible; }
.kj-cal tr.sec th span { padding: 0 12px; }
html body main table.kj-cal tr.tot :is(td, th) { background: color-mix(in srgb, var(--ink) 4%, var(--surface)); font-weight: 700; }
/* 수요일 굵은 선·월요일 묶음 선 없앰(11/12 사용자 '진한 선 왜 넣었냐') · 라인 묶음 끝만 굵게 */
html body main table.kj-cal :is(td, th):is(.wst, .gsep) { border-left: 1px solid var(--v2-line, var(--line)) !important; }
html body main table.kj-cal.kjpa tbody tr.r2 > :is(td, th), html body main table.kj-cal:not(.kjpa) tbody tr:not(.sec) > :is(td, th) { border-bottom: 2px solid color-mix(in srgb, var(--ink) 45%, var(--surface)) !important; }
/* 오늘 = 칸마다 테두리 말고 한 줄 통째로 진한 파랑 바탕 */
html body main table.kj-cal :is(td, th).now { background: color-mix(in srgb, var(--kj-ac) 26%, var(--surface)) !important; box-shadow: none !important; border-left: 2px solid var(--kj-ac) !important; border-right: 2px solid var(--kj-ac) !important; } html body main table.kj-cal thead th.now { background: var(--kj-ac) !important; } .kj-cal thead th.now :is(b, span) { color: #fff !important; }

/* 8. 조치 */
html.v2 body main .kj-act td:nth-child(3) { white-space: normal; word-break: keep-all; }

@media (max-width: 1500px) { .kj-k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kj-sch ol { grid-template-columns: repeat(4, minmax(0, 1fr)); } .kj-sch li:nth-child(4n + 1) { border-left: 0; } .kj-sch li:nth-child(n + 5) { border-top: 1px solid var(--v2-line, var(--line)); padding-top: 8px; } }
