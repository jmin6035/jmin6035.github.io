<link rel="stylesheet" href="ui/theme.css?v=2611070202">
<style>
main.wrap { max-width: none; }
#ui-ctl { display: none !important; }   /* 포털 공통 그룹 상태 띠 — ① 그룹 매트릭스와 같은 내용이라 이 탭에서만 숨김 */
/* 머리: 기준일·필터·마감 */
.sj-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 4px 0 10px; font-size: 13.5px; }
.sj-pill { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: var(--surface); white-space: nowrap; }
.sj-pill.b { background: var(--tint); font-weight: 700; color: var(--brand-2); border-color: transparent; }
.sj-pill.s { color: var(--ink-2); }
.sj-flt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; font-size: 13.5px; }
.sj-flt select { font: inherit; font-size: 13.5px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.sj-dl { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.sj-chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13.5px; white-space: nowrap; background: var(--surface); }
.sj-chip .d { font-weight: 800; margin-right: 4px; }
.sj-chip.r .d { color: var(--bad); } .sj-chip.o .d { color: var(--warn); } .sj-chip.n .d { color: var(--brand-2); }
/* 월간 운영 일정 띠: 짧은 막대는 이름을 막대 밖에 */
.sj-sch { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 6px; margin: 0 0 18px; }
.sj-sch .cap { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-2); margin: 0 0 6px; font-weight: 700; }
.sj-gr { display: grid; grid-template-columns: 330px minmax(0, 1fr); align-items: center; gap: 12px; min-height: 26px; }
.sj-gr .nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .sj-gr .nm .ct-b { font-size: 12.5px; padding: 1px 8px; margin-right: 4px; }
.sj-gr .tl { position: relative; height: 20px; background: var(--sub); border-radius: 4px; }
.sj-gr .tl .sb { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; color: #fff; font-size: 12px; line-height: 16px; padding-left: 4px; overflow: hidden; white-space: nowrap; }
.sj-gr .tl .now { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--bad); }
.sj-gr .tl.ax { background: none; height: 18px; font-size: 12.5px; color: var(--ink-2); } .sj-gr .tl.ax span { position: absolute; transform: translateX(-50%); }
.sj-h { margin: 4px 0 14px; } .sj-h h2 { font-size: 22px; margin: 0; } .sj-h p { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; }
/* KPI 칸 수 */
.ct-kpis.sj-k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ct-kpis.sj-lc { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1300px) { .ct-kpis.sj-k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ct-kpis.sj-lc { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ct-kpi .l .ct-b { margin-left: 6px; font-size: 12.5px; padding: 1px 8px; }
.ct-kpi .s { line-height: 1.55; }
.sj-kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; padding: 2px 0; } .sj-kv span { color: var(--ink-2); white-space: nowrap; } .sj-kv b { text-align: right; }
.sj-pv td { vertical-align: top !important; } .sj-pv .it { display: block; white-space: nowrap; font-size: 13px; line-height: 1.6; text-align: left; }
.sj-lg span { white-space: nowrap; margin-right: 14px; display: inline-block; } .sj-kv b { font-variant-numeric: tabular-nums; }
.sj-tag { display: inline-block; background: var(--sub); border-radius: 4px; padding: 1px 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; margin: 1px 2px; }
.sj-foot { font-size: 13.5px; color: var(--ink-2); margin: 10px 0 0; line-height: 1.6; }
.sj-g2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; } .sj-g2 > .card, .sj-g2 > div > .card { margin: 0 0 18px; }
.sj-g2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } .sj-g2e > .card { margin: 0 0 18px; }
@media (max-width: 1100px) { .sj-g2, .sj-g2e { grid-template-columns: 1fr; } }
.sj-svg { display: block; max-width: 100%; height: auto; } .sj-svg text { font-size: 12.5px; fill: var(--ink-2); }
/* 진도 막대 */
.sj-bar { position: relative; height: 10px; background: var(--sub); border-radius: 5px; margin: 6px 0 2px; }
.sj-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.sj-bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.sj-gb { margin: 0 0 14px; font-size: 13.5px; } .sj-gb .h { display: flex; justify-content: space-between; gap: 8px; } .sj-gb .h span { font-weight: 700; }
td .sj-bar { min-width: 150px; }
/* 일별 계획 캘린더 */
.sj-cal { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; table-layout: fixed; width: 100%; min-width: 1200px; }
.sj-cal th, .sj-cal td { border: 1px solid var(--grid, var(--line)); padding: 0; height: 32px; width: 36px; min-width: 36px; font-size: 12.5px; }
.sj-cal th { background: var(--th, var(--sub)); font-weight: 700; color: var(--ink-2); height: 40px; line-height: 1.25; }
.sj-cal th.we { color: var(--bad); }
.sj-cal .lab { width: 118px; min-width: 118px; padding: 0 10px; font-weight: 700; background: var(--surface); position: sticky; left: 0; z-index: 1; }
.sj-cal td.lab small { display: block; font-weight: 500; color: var(--ink-2); font-size: 12.5px; }
.sj-cal .now { box-shadow: inset 0 0 0 2px var(--bad); }
.sj-cal td.ok { background: var(--good-bg); } .sj-cal td.warn { background: var(--warn-bg); } .sj-cal td.bad { background: var(--bad-bg); }
.sj-cal td.ac { font-weight: 800; } .sj-cal td.pl { color: var(--ink); background: var(--tint); } .sj-cal td.zero { color: var(--ink-3, var(--ink-2)); background: var(--sub); }
.sj-cal td.in { font-weight: 800; }
.sj-cal tr.sec td { text-align: left !important; font-weight: 700; background: var(--tint-2, var(--tint)); padding: 0 10px; height: 30px; font-size: 13px; }
.sj-cal tr.wk td { font-size: 12.5px; color: var(--ink-2); }
.sj-in { font: inherit; font-size: 13.5px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); color: var(--ink); width: 110px; }
select.sj-in { width: auto; }
.pos { color: var(--good); } .neg { color: var(--bad); } .wrn { color: var(--warn); }
</style>
