.lt-bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; } .lt-bar2 input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); } #lt-memo { flex: 1 1 220px; } #lt-who { width: 120px; }

table.t td.d { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.lt-seg { display: inline-flex; gap: 6px; margin: 0 0 10px; } .lt-seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; } .lt-seg button[aria-pressed="true"] { background: var(--brand-2); color: var(--on-brand, #fff); border-color: var(--brand-2); }
